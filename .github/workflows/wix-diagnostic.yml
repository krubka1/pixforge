# Diagnostic for a failed MSI link.
#
# This cannot live in the generated Release workflow: dist owns release.yml and
# refuses to run when that file does not match `dist generate` output, so a
# hand-added step stops every release. Hence a separate workflow, triggered off
# the Release workflow's failure.
#
# Why it is needed: cargo-wix (which dist calls) sends candle/light stdout and
# stderr to /dev/null, so a WiX failure is reported only as
# "light failed with exit code = 204" with no diagnostic. This reruns the same
# link with output visible.
#
# Delete this file once the MSI builds.

name: WiX diagnostic

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: windows-2022
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Rust non-interactively if not already installed
        run: rustup show active-toolchain || rustup toolchain install stable --profile minimal

      # Caches the cargo-wix binary and the compiled exe. The exe is what makes
      # this job slow, and it does not change when only the .wxs files change,
      # so later iterations should skip the ~8 minute Rust build.
      - name: Cache cargo-wix and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-wix.exe
            target
          key: wix-diag-${{ hashFiles('Cargo.lock') }}
          restore-keys: wix-diag-

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Show the WiX error
        shell: pwsh
        run: cargo wix --nocapture 2>&1 | Tee-Object -FilePath wix-error.log
